name: Refresh London photo catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
  push:
    paths:
      - 'scripts/build_photo_catalog.py'
      - '.github/workflows/refresh-photo-catalog.yml'
permissions:
  contents: write
concurrency:
  group: london-photo-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build validated Commons photo metadata catalogue
        run: python scripts/build_photo_catalog.py
      - name: Commit new metadata only if changed
        run: |
          if git diff --quiet -- photo-catalog.js; then
            echo 'Photo catalogue unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add photo-catalog.js
          git commit -m 'Refresh validated Commons photo catalogue'
          git push
