name: Refresh OS Thames geometry
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/thames-geometry.yml'
      - 'scripts/generate_thames.py'
  schedule:
    - cron: '0 8 1 5,11 *'
permissions:
  contents: write
jobs:
  refresh-thames:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS geometry library
        run: python -m pip install shapely==2.1.2
      - name: Generate OS-derived offline Thames coordinates
        run: python scripts/generate_thames.py
      - name: Commit reviewed geometry output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thames-geometry.js
          if ! git diff --staged --quiet; then
            git commit -m "Update Thames centreline from OS Open Rivers"
            git push
          fi
